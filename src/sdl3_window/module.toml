[module]
name = "helios_sdl3_window"
version = "0.1.0"
description = "SDL3 backend for the helios_window ECS contract"
languages = ["cpp"]
default = true
implements = ["window"]
c_api = true

[build]
system = "cmake"

[dependencies]
public = ["helios_app", "helios_compiler", "helios_ecs", "helios_log", "helios_memory", "helios_platform", "helios_sdl3", "helios_window"]
private = []

[dependencies.optional]
public = ["helios_input"]
private = []
